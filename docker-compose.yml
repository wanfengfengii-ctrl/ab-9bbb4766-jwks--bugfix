# Clean-station deployment for the calibration evidence bundle service.
#
#   HOST_PORT=9090 docker compose up --build
#
# Flow: keygen (one-shot, renders the manifest + registered issuer key) ->
# calibration-server (health-checked, durable replay volume) -> verify
# (one-shot acceptance: go tests, build and live download/tamper/replay smoke).
# The verify container exits 0 only when every acceptance check passes; inspect
# with `docker compose ps` / `docker compose logs verify`.

name: calibration-bundles

x-verify-env: &verify-env
  CONFIG_PATH: /etc/calibration/config.json
  ISSUER_KEY: /secrets/issuer/jwk-private.json
  BASE_URL: http://calibration-server:8080
  SRC_DIR: /app/src
  SERVER_BIN: /usr/local/bin/calibration-server

services:
  # One-shot provisioning job: generates the ES256 issuer JWK pair (once) and
  # writes the validated manifest with lowercase SHA-256 digests.
  keygen:
    build:
      context: .
      target: verify
    image: calibration-verify:dev
    user: root
    # Provision, then hand the volume contents to the non-root uid (65532)
    # used by both the server and verify containers.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        /usr/local/bin/keygen \
          --keys-dir=/secrets/issuer \
          --config=/etc/calibration/config.json \
          --evidence-dir=/evidence \
          --bundle-id="$${BUNDLE_ID:-B-2026-0042}" \
          --public-origin="$${PUBLIC_ORIGIN:-https://api.met-lab.example}" \
          --issuer="$${ISSUER:-https://issuer.met-lab.example}" \
          --audience="$${AUDIENCE:-calibration-bundles-api}" \
          --subject="$${SUBJECT:-partner-lab-alpha}"
        chown -R 65532:65532 /secrets/issuer /etc/calibration
        chmod 600 /secrets/issuer/jwk-private.json
        touch /tmp/provisioned-successfully
        while :; do sleep 3600; done
    environment:
      BUNDLE_ID: ${BUNDLE_ID:-B-2026-0042}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://api.met-lab.example}
      ISSUER: ${ISSUER:-https://issuer.met-lab.example}
      AUDIENCE: ${AUDIENCE:-calibration-bundles-api}
      SUBJECT: ${SUBJECT:-partner-lab-alpha}
    volumes:
      - cal-keys:/secrets/issuer
      - cal-config:/etc/calibration
      - ./examples/evidence:/evidence:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/provisioned-successfully && test -s /secrets/issuer/jwk-private.json && test -s /etc/calibration/config.json"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 2s
    restart: "no"

  calibration-server:
    build:
      context: .
      target: server
    image: calibration-server:dev
    # Host-side port is configurable; the container always listens on 8080.
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      LISTEN_ADDR: ":8080"
      CONFIG_PATH: /etc/calibration/config.json
      REPLAY_DIR: /var/lib/calibration/replay
    volumes:
      - type: volume
        source: cal-config
        target: /etc/calibration
        read_only: true
      - type: volume
        source: cal-keys
        target: /secrets/issuer
        read_only: true
      - ./examples/evidence:/evidence:ro
      - cal-replay:/var/lib/calibration/replay
    # Dockerfile HEALTHCHECK gates the verify service.
    depends_on:
      keygen:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/healthz | grep -q '\"ok\"' || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  # One-shot acceptance service: waits for health, then runs unit tests,
  # builds, and performs byte-exact download, tampering, concurrency and
  # restart-replay smoke tests. Exits non-zero on any failure.
  verify:
    build:
      context: .
      target: verify
    image: calibration-verify:dev
    environment: *verify-env
    volumes:
      - type: volume
        source: cal-config
        target: /etc/calibration
        read_only: true
      - type: volume
        source: cal-keys
        target: /secrets/issuer
        read_only: true
      - ./examples/evidence:/evidence:ro
      # Writable scratch for the go test/build phase.
    tmpfs:
      - /tmp:exec
    depends_on:
      keygen:
        condition: service_healthy
      calibration-server:
        condition: service_healthy
    restart: "no"

volumes:
  cal-config:
  cal-keys:
  cal-replay:
